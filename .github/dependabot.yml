version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e/js-client
    schedule:
      interval: weekly
    # The e2e pins the better-auth release the port targets; bump these together with a port.
    ignore:
      - dependency-name: "better-auth"
      - dependency-name: "@better-auth/*"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
